<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardapio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    <header>

        <div class="logo-area">

            <img src="logo.png" alt="Logo">

            <h2>Sushi da Barriguda</h2>

        </div>
        <div class="cart">
            <a href="carrinho.html"><i class="fa-solid fa-cart-shopping"></i></a>
        </div>


    </header>

    <section class="cardapio">

        <nav>
            <a href="cardapio.html">Combos</a>
            <a href="">Hot Roll</a>
            <a href="">Temaki</a>
            <a href="">Bebidas</a>
        </nav>

        <div class="titulo-cardapio">

            <p class="subtitulo-cardapio">Nosso Cardápio</p>

        </div>

        <div class="container-cards">

            <div class="card">

                <a class="card-link" href="add.html">
                    <img src="https://static.tagme.com.br/pubimg/thumbs/MenuItem/ae9579f0-f164-11ef-9cf3-99c7b85b3a1f.jpg?ims=filters:quality(50):format(webp)"
                        alt="">
                    <div class="card-info">

                        <h3>Hot Roll</h3>

                        <p>Hot Roll</p>

                        <div>
                            <span class="preco">R$ 34,90</span>


                        </div>
                    </div>
                </a>
            </div>

            <div class="card">

                <img src="https://static.tagme.com.br/pubimg/thumbs/MenuItem/56d523c0-22d6-11f0-9b2f-3bb9909af7bc.jpg?ims=filters:quality(50):format(webp)"
                    alt="">
                <div class="card-info">
                    <h3>Temaki Salmão</h3>

                    <p>
                        Salmão fresco e cebolinha.
                    </p>

                    <div>
                        <span class="preco">R$ 28,90</span>


                    </div>
                </div>

            </div>

            <div class="card">

                <img src="https://static.tagme.com.br/pubimg/thumbs/MenuItem/2ddbda00-fc79-11ef-b010-e19a8e4489ad.jpg?ims=filters:quality(50):format(webp)"
                    alt="">
                <div class="card-info">
                    <h3>Combo Premium</h3>

                    <p>
                        30 peças especiais.
                    </p>
                    <div>
                        <span class="preco">R$ 89,90</span>


                    </div>
                </div>
            </div>

        </div>

    </section>
</body>

</html>
