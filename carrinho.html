<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="carrinho">

        <header class="topo">

            <a href="cardapio.html">
                <button id="voltar" class="voltar">
                    ←
                </button>
            </a>

            <h1>Meu Carrinho</h1>

            <button class="limpar">
                🗑
            </button>

        </header>

        <div class="logo-container">
            <div class="linha"></div>
        </div>



        <section class="lista-produtos">

            <div class="item">
                <img src="https://static.tagme.com.br/pubimg/thumbs/MenuItem/ae9579f0-f164-11ef-9cf3-99c7b85b3a1f.jpg?ims=filters:quality(50):format(webp)"
                    alt="Hot Roll">

                <div class="info">

                    <h2>Hot Roll</h2>

                    <p>Salmão, cream cheese e cebolinha</p>

                    <div class="quantidade">

                        <button>-</button>

                        <span>2</span>

                        <button>+</button>

                    </div>

                </div>

                <span class="preco">
                    R$ 69,80
                </span>

            </div>

            <div class="item">
                <img src="https://static.tagme.com.br/pubimg/thumbs/MenuItem/ae9579f0-f164-11ef-9cf3-99c7b85b3a1f.jpg?ims=filters:quality(50):format(webp)"
                    alt="Hot Roll">

                <div class="info">

                    <h2>Temaki salmão</h2>

                    <p>Salmão, cream cheese e cebolinha</p>

                    <div class="quantidade">

                        <button>-</button>

                        <span>1</span>

                        <button>+</button>

                    </div>

                </div>

                <span class="preco">
                    R$ 69,80
                </span>

            </div>

            <div class="item">
                <img src="https://static.tagme.com.br/pubimg/thumbs/MenuItem/ae9579f0-f164-11ef-9cf3-99c7b85b3a1f.jpg?ims=filters:quality(50):format(webp)"
                    alt="Hot Roll">

                <div class="info">
                    <h2>Temaki salmão</h2>

                    <p>Salmão, cream cheese e cebolinha</p>

                    <div class="quantidade">

                        <button>-</button>

                        <span>1</span>

                        <button>+</button>

                    </div>

                </div>

                <span class="preco">
                    R$ 69,80
                </span>

            </div>


        </section>

        <div class="botoes">
            <section class="resumos">
                <div class="divisor"></div>
                <div class="total">
                    <span>Total</span>
                    <span>R$ 77,80</span>
                </div>
            </section>

            <div class="btn-finalizar">
                <a href="pagamento.html">
                    <h1>Finalizar Pedido</h1>
                </a>
            </div>
            <div class="btn-comprando">
                Continuar Comprando
            </div>
        </div>

    </main>
</body>

</html>
