<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>carrinho</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="topo">
        <img src="logo.png" alt="">
            
        <h1>Sushi da Barriguda</h1>
    </header>

    <section class="produto">
        <img src="https://static.tagme.com.br/pubimg/thumbs/MenuItem/ae9579f0-f164-11ef-9cf3-99c7b85b3a1f.jpg?ims=filters:quality(50):format(webp)">

        <div class="info">
            <h2>Hot Roll</h2>

            <p>5 sashimi salmao, 5 joy joy, 5 niguiri salmao,<br> 5 hossomaki especial, 10 urumaki camarao com salmao
                especial</p>

            <span class="preco">R$ 34,90</span>
        </div>
    </section>

    <div class="divider"></div>

    <section class="adicionais">
        <h3>ADICIONAIS</h3>

        <div class="extra-item">
            <label class="opcao">
                <input type="checkbox">
                molho tarê
            </label>

            <span>R$ 2,00</span>
        </div>

        <div class="extra-item">
            <label class="opcao">
                <input type="checkbox">
                cream cheese
            </label>

            <span>R$ 1,50</span>
        </div>
    </section>


    

    

    <div class="obs">
        OBSERVAÇÕES
        <p>Alguma observação sobre o seu pedido</p>
    </div>

    <div class="digitar">
        Ex: Sem cebola, pouco molho...
    </div>

    <div class="divider"></div>

    <div class="rodape">
        <button class="btn-carrinho">
            adicionar ao pedido
        </button>
    </div>
</body>

</html>
