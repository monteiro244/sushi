<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardapio</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="logo-area">
            <img src="logo.png" alt="Logo">

            <h2>Sushi da Barriguda</h2>
        </div>
    </header>

    <section class="cardapio">

        <div>
            <img class="produto-imagem"
                src="https://static.tagme.com.br/pubimg/thumbs/MenuItem/ae9579f0-f164-11ef-9cf3-99c7b85b3a1f.jpg?ims=filters:quality(50):format(webp)">

        </div>


        <div class="card-info">
            <h3>Hot Roll</h3>

            <p>5 sashimi salmao, 5 joy joy, 5 niguiri salmao,<br> 5 hossomaki especial, 10 urumaki camarao com salmao
                especial</p>

            <div>
                <span class="preco">R$ 34,90</span>
            </div>

            <div class="divider"></div>

            <div class="extras">
                Adicionais
                <p>selecione os itens que deseja adicionar ao pedido</p>
            </div>
        </div>

        <div class="extras-section">
            <div class="extra-item">
                <div class="extra-left">
                    <input type="radio" name="adicional">
                    <span>Molho Tarê</span>
                </div>
                <span class="extra-price">+ R$ 2,00</span>
            </div>

            <div class="extra-item">
                <div class="extra-left">
                    <input type="radio" name="adicional">
                    <span>Cream Cheese</span>
                </div>
                <span class="extra-price">+ R$ 3,00</span>
            </div>

            <div class="extra-item">
                <div class="extra-left">
                    <input type="radio" name="adicional">
                    <span>Cebolinha</span>
                </div>
                <span class="extra-price">+ R$ 1,50</span>
            </div>
        </div>
        

       
         


    </section>
</body>

</html>
